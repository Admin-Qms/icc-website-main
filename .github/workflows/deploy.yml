name: Build and Deploy

# Builds the static site on every push to main and publishes the built
# output (out/) to the `deploy` branch. cPanel's Git Version Control
# tracks that branch and copies it into public_html via .cpanel.yml.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Add cPanel deploy script to build output
        run: cp deploy/.cpanel.yml out/.cpanel.yml

      - name: Publish build to deploy branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: deploy
          force_orphan: true
